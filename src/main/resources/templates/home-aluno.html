<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a href="/">Sair</a>
            </nav>
        </header>

        <main>

            <h2>Ofertas de Disciplinas</h2>

            <div th:if="${ofertas == null or ofertas.isEmpty()}">
                <p>Não há ofertas de disciplinas disponíveis no momento.</p>
            </div>

            <div class="ofertas">

                <div class="card-oferta" th:each="oferta : ${ofertas}">

                    <h3 th:text="${oferta.disciplina.nome}">
                        Nome da disciplina
                    </h3>

                    <p>
                        Área:
                        <span th:text="${oferta.disciplina.area}">
                            Área
                        </span>
                    </p>

                    <p>
                        Carga Horária:
                        <span th:text="${oferta.disciplina.cargaHoraria}">
                            Carga horária
                        </span>
                    </p>

                    <p>
                        Professor:
                        <span th:text="${oferta.professor.nome}">
                            Professor
                        </span>
                    </p>

                    <form th:action="@{/matricula}" method="post" class="form-inline">

                        <input type="hidden"
                               name="idOfertaDisc"
                               th:value="${oferta.id}">

                        <button type="submit">
                            Matricular-se
                        </button>

                    </form>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
