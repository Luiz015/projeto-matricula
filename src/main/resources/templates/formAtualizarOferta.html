<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Oferta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a th:href="@{/home-prof}">Voltar</a>
            </nav>
        </header>

        <main>

            <h1>Atualizar Oferta</h1>

            <p th:if="${mensagem}" th:text="${mensagem}" class="mensagem"></p>

            <form th:action="@{/oferta/atualizar}"
                  th:object="${oferta}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <label for="professor">Professor:</label>
                <select id="professor" th:field="*{professor}" required>

                    <option th:each="professor : ${professores}"
                            th:value="${professor.id}"
                            th:text="${professor.nome}">
                    </option>

                </select>

                <label for="disciplina">Disciplina:</label>
                <select id="disciplina" th:field="*{disciplina}" required>

                    <option th:each="disciplina : ${disciplinas}"
                            th:value="${disciplina.idDisciplina}"
                            th:text="${disciplina.nome}">
                    </option>

                </select>

                <button type="submit">Atualizar Oferta</button>

            </form>

            <a th:href="@{/home-prof}" class="voltar-link">Voltar para início</a>

        </main>

    </div>

</body>
</html>
