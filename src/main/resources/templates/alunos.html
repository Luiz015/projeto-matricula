<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a href="/aluno">Cadastrar Aluno</a>
                <a href="/home-prof" class="voltar-link">Voltar</a>
            </nav>
        </header>

        <main>

            <h2>Alunos</h2>

            <div class="alunos">

                <div class="card-aluno" th:each="aluno : ${alunos}">

                    <h2 th:text="${aluno.nome}"></h2>

                    <p>
                        Prontuário:
                        <span th:text="${aluno.prontuario}"></span>
                    </p>

                    <p>
                        CPF:
                        <span th:text="${aluno.cpf}"></span>
                    </p>

                    <p>
                        Email:
                        <span th:text="${aluno.email}"></span>
                    </p>

                    <p>
                        Data de nascimento:
                        <span th:text="${aluno.dtNascimento}"></span>
                    </p>

                    <a th:href="@{/aluno/atualizar/{id}(id=${aluno.id})}">
                        Atualizar
                    </a>

                    <form th:action="@{/aluno/excluir/{id}(id=${aluno.id})}"
                          method="post"
                          class="form-inline">

                        <button type="submit">
                            Excluir
                        </button>

                    </form>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
