<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a th:href="@{/home-prof}">Voltar</a>
            </nav>
        </header>

        <main>

            <h1>Cadastrar Curso</h1>

            <p th:if="${mensagem}" th:text="${mensagem}" class="mensagem"></p>

            <form th:action="@{/curso}" method="post">

                <label for="nome">Nome do curso:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="duracao">Duração:</label>
                <input type="text" id="duracao" name="duracao" placeholder="Ex: 4 anos" required>

                <label for="cargaHoraria">Carga horária:</label>
                <input type="text" id="cargaHoraria" name="cargaHoraria" placeholder="Ex: 3200 horas" required>

                <button type="submit">Cadastrar Curso</button>

            </form>

            <a th:href="@{/home-prof}" class="voltar-link">Voltar para início</a>

        </main>

    </div>

</body>
</html>
