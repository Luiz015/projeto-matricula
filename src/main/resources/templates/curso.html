<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a th:href="@{/home-prof}">Voltar</a>
            </nav>
        </header>

        <main>
            <h1 th:text="${curso.nome}"></h1>

            <p>
                Duração:
                <span th:text="${curso.duracao}"></span>
            </p>

            <p>
                Carga Horária:
                <span th:text="${curso.cargaHoraria}"></span>
            </p>

            <a th:href="@{/home-prof}" class="voltar-link">Voltar</a>
        </main>

    </div>

</body>
</html>
