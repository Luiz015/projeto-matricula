<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Oferta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Cadastrar Oferta</h1>

    <p th:if="${mensagem}" th:text="${mensagem}"></p>

    <form th:action="@{/oferta}" th:object="${oferta}" method="post">

        <label for="professor">Professor:</label>
        <select id="professor" th:field="*{professor}" required>
            <option value="">Selecione um professor</option>

            <option th:each="professor : ${professores}"
                    th:value="${professor.id}"
                    th:text="${professor.nome}">
            </option>
        </select>

        <br><br>

        <label for="disciplina">Disciplina:</label>
        <select id="disciplina" th:field="*{disciplina}" required>
            <option value="">Selecione uma disciplina</option>

            <option th:each="disciplina : ${disciplinas}"
                    th:value="${disciplina.idDisciplina}"
                    th:text="${disciplina.nome}">
            </option>
        </select>

        <br><br>

        <button type="submit">Cadastrar Oferta</button>

    </form>

    <br>

    <a th:href="@{/home-prof}">Voltar</a>

</body>
</html>
