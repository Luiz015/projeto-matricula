<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a th:href="@{/home-prof}">Voltar</a>
            </nav>
        </header>

        <main>

            <h1>Atualizar Disciplina</h1>

            <p th:if="${mensagem}" th:text="${mensagem}" class="mensagem"></p>

            <form th:action="@{/disciplina/atualizar}"
                  th:object="${disciplina}"
                  method="post">

                <input type="hidden" th:field="*{idDisciplina}">

                <label for="nome">Nome da disciplina:</label>
                <input type="text" id="nome" th:field="*{nome}" required>

                <label for="cargaHoraria">Carga horária:</label>
                <input type="text" id="cargaHoraria" th:field="*{cargaHoraria}" required>

                <label for="area">Área:</label>
                <input type="text" id="area" th:field="*{area}" required>

                <label for="curso">Curso:</label>
                <select id="curso" th:field="*{curso}" required>

                    <option th:each="curso : ${cursos}"
                            th:value="${curso.idCurso}"
                            th:text="${curso.nome}">
                    </option>

                </select>

                <button type="submit">Atualizar Disciplina</button>

            </form>

            <a th:href="@{/home-prof}" class="voltar-link">Voltar para início</a>

        </main>

    </div>

</body>
</html>
