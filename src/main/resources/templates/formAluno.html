<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <header class="cabecalho">
            <div class="logo">
                <a href="/">
                    <img th:src="@{/img/logo.png}"
                         alt="Logo IFSP"
                         class="logo-img">
                </a>
            </div>

            <nav>
                <a th:href="@{/home-prof}">Voltar</a>
            </nav>
        </header>

        <main>

            <h1>Cadastrar Aluno</h1>

            <p th:if="${mensagem}" th:text="${mensagem}" class="mensagem"></p>

            <form th:action="@{/aluno}"
                  th:object="${aluno}"
                  method="post">

                <label>Nome:</label>
                <input type="text"
                       th:field="*{nome}"
                       required>

                <label>CPF:</label>
                <input type="text"
                       th:field="*{cpf}"
                       required>

                <label>Email:</label>
                <input type="email"
                       th:field="*{email}"
                       required>

                <label>Data de nascimento:</label>
                <input type="date"
                       th:field="*{dtNascimento}"
                       required>

                <label>Prontuário:</label>
                <input type="text"
                       th:field="*{prontuario}"
                       required>

                <label>Senha:</label>
                <input type="password"
                       th:field="*{senha}"
                       required>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <a href="/alunos" class="voltar-link">Voltar para lista</a>

        </main>

    </div>

</body>
</html>
